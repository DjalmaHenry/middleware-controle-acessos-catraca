name: Gerar instalador Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar, testar e gerar instalador
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\build-windows.ps1
      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v4
        with:
          name: ponte-id-windows
          path: release/*Setup*.exe
          if-no-files-found: error
